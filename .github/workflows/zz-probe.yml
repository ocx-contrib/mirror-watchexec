name: zz-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: ocx-sh/setup-ocx@de8e3366f812941423985eaccae28663ef192e8b
        with:
          version: "0.5.3"
      - name: prepare bundles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ocx-mirror package pipeline prepare --spec watchexec/mirror.yml --version 2.6.1
      - name: diag script
        run: |
          set -uo pipefail
          cat > "$RUNNER_TEMP/diag.star" <<'STAR'
          ENV = {"HOME": ocx.scratch_root}
          ocx.mkdir("watched")

          VARIANTS = [
              ("baseline", "--stop-timeout", "10s"),
              ("wrap-none", "--wrap-process", "none"),
              ("stop-timeout-60s", "--stop-timeout", "60s"),
              ("stop-signal-CONT", "--stop-signal", "SIGCONT"),
              ("no-process-group", "--no-process-group", "--quiet"),
          ]

          def probe():
              tally = {}
              for i in range(5):
                  for v in VARIANTS:
                      label = v[0]
                      name = "tok-%s-%d.txt" % (label, i)
                      r = ocx.run(
                          "watchexec", "--stdin-quit", v[1], v[2],
                          "--shell", "sh", "-w", "watched", "--",
                          "printf OCXSMOKE-OK > " + name,
                          stdin = "",
                          env = ENV,
                      )
                      got = ocx.read_file(name) if ocx.exists(name) else "<MISSING>"
                      tally[label] = tally.get(label, []) + ["rc=%d body=%r" % (r.exit_code, got)]
              for v in VARIANTS:
                  print("VARIANT", v[0], tally[v[0]])

          probe()
          STAR
          VDIR=$(ls -d .ocx-mirror/2.6.1_* 2>/dev/null || echo .ocx-mirror/2.6.1)
          for P in darwin/amd64 darwin/arm64; do
            SLUG="${P//\//_}"
            cp "${VDIR}/${SLUG}/metadata.json" "${VDIR}/${SLUG}/bundle-metadata.json"
            echo "############ $P"
            ocx package test --platform "$P" --identifier "ghcr.io/ocx-contrib/watchexec/watchexec:2.6.1" \
              "${VDIR}/${SLUG}/bundle.tar.xz" --script "$RUNNER_TEMP/diag.star" || echo "rc=$?"
          done
