name: zz-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: ocx-sh/setup-ocx@de8e3366f812941423985eaccae28663ef192e8b
        with:
          version: "0.5.3"
      - name: prepare bundles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ocx-mirror package pipeline prepare --spec watchexec/mirror.yml --version 2.6.1
          ocx-mirror package pipeline prepare --spec watchexec/mirror.yml --version 2.5.1
      - name: diag script
        run: |
          set -uo pipefail
          cat > "$RUNNER_TEMP/diag.star" <<'STAR'
          ENV = {"HOME": ocx.scratch_root}
          ocx.mkdir("watched")

          def probe():
              out = []
              for i in range(3):
                  name = "tok-%d.txt" % i
                  r = ocx.run(
                      "watchexec", "--stdin-quit",
                      "--shell", "sh", "-w", "watched", "--",
                      "printf OCXSMOKE-OK > " + name,
                      stdin = "",
                      env = ENV,
                  )
                  got = ocx.read_file(name) if ocx.exists(name) else "<MISSING>"
                  out.append("rc=%d body=%r" % (r.exit_code, got))
              print("COLD-SEQ", out)

          probe()
          STAR
          for V in 2.6.1 2.5.1; do
            VDIR=$(ls -d ".ocx-mirror/${V}_"* 2>/dev/null || echo ".ocx-mirror/${V}")
            for P in darwin/amd64 darwin/arm64; do
              SLUG="${P//\//_}"
              cp "${VDIR}/${SLUG}/metadata.json" "${VDIR}/${SLUG}/bundle-metadata.json"
              echo "############ $V $P"
              ocx package test --platform "$P" --identifier "ghcr.io/ocx-contrib/watchexec/watchexec:${V}" \
                "${VDIR}/${SLUG}/bundle.tar.xz" --script "$RUNNER_TEMP/diag.star" || echo "rc=$?"
            done
          done
